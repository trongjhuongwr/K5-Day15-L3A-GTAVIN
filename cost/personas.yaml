# Chạy 10 phiên kiểm khung: python run.py simulate --try
# Chạy đầy đủ ở CP4: python run.py simulate --rate-from eval/run-2.csv

sessions: 50        # Mức tối thiểu theo guide §4.2
seed: 42            # Giữ seed của khung để tái lập kế hoạch phiên

users:
  low: 300
  base: 700
  high: 1000
  source: "300 / 700 / 1000 người dùng theo kịch bản (tự ước tính). Kịch bản cơ sở tham chiếu 721 tài khoản preclass theo evidence/data-mining.md."

